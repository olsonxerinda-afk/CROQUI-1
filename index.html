<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa de Mesas Interativo - Ester & Prince</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f7f5f0;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .brand-title {
      color: #b89759;
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: 3px;
      margin: 10px 0 5px 0;
      text-align: center;
      text-transform: uppercase;
    }

    h1 {
      color: #555;
      margin-top: 0;
      margin-bottom: 15px;
      font-size: 1.2rem;
      font-weight: 400;
      font-style: italic;
    }

    .search-container {
      margin-bottom: 20px;
      width: 100%;
      max-width: 500px;
      position: relative;
    }

    .search-input {
      width: 100%;
      padding: 12px 20px;
      font-size: 16px;
      border: 2px solid #b89759;
      border-radius: 25px;
      outline: none;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      transition: all 0.3s ease;
      background-color: #ffffff;
    }

    .search-input:focus {
      box-shadow: 0 4px 12px rgba(184, 151, 89, 0.4);
    }

    .map-wrapper {
      position: relative;
      display: inline-block;
      max-width: 1000px;
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
      background-color: #fff;
    }

    .map-image {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Base para os marcadores de destaque */
    .pin {
      position: absolute;
      transform: translate(-50%, -50%);
      pointer-events: none;
      opacity: 0;
      transition: all 0.3s ease;
      border-radius: 8px;
    }

    /* Tipos de tamanhos adaptados ao croqui */
    .pin.table-v { width: 5.5%; height: 16%; } /* Mesas retangulares verticais */
    .pin.table-h { width: 12%; height: 7%; }   /* Mesas/Balcões horizontais */
    .pin.serp-v  { width: 5.5%; height: 28%; border-radius: 20px; } /* Serpentinas longas */
    .pin.serp-s  { width: 5.5%; height: 32%; border-radius: 20px; } /* Serpentina 09 / 10 */
    .pin.dj      { width: 13%; height: 8%; }

    /* Estilo ativo ao encontrar */
    .pin.active {
      opacity: 1;
      background-color: rgba(217, 83, 79, 0.45);
      border: 3px solid #d9534f;
      box-shadow: 0 0 20px 8px rgba(217, 83, 79, 0.7);
      animation: pulse 1.2s infinite alternate;
    }

    @keyframes pulse {
      0% { transform: translate(-50%, -50%) scale(1); }
      100% { transform: translate(-50%, -50%) scale(1.15); }
    }

    .no-results {
      color: #d9534f;
      margin-top: 8px;
      font-weight: bold;
      text-align: center;
      min-height: 24px;
    }
  </style>
</head>
<body>

  <div class="brand-title">Ester & Prince</div>
  <h1>Localizador de Mesas e Espaços</h1>

  <div class="search-container">
    <input type="text" id="searchInput" class="search-input" placeholder="Digite a mesa (ex: 1, 12, Serp A, Mesa A, DJ)...">
    <div id="statusMessage" class="no-results"></div>
  </div>

  <div class="map-wrapper">
    <img id="mapImg" src="CROQUI'2.png" alt="Mapa de Lugares Ester e Prince" class="map-image">

    <!-- LADO ESQUERDO DA PISTA -->
    <div id="pin-1" class="pin table-v" style="left: 12.2%; top: 26.5%;"></div>
    <div id="pin-12" class="pin table-v" style="left: 20.2%; top: 26.5%;"></div>
    <div id="pin-serp-a" class="pin serp-v" style="left: 28.2%; top: 40.0%;"></div>
    <div id="pin-3" class="pin table-v" style="left: 35.5%; top: 26.5%;"></div>
    <div id="pin-a" class="pin table-v" style="left: 42.4%; top: 26.5%;"></div>

    <div id="pin-7" class="pin table-v" style="left: 12.2%; top: 48.0%;"></div>
    <div id="pin-8" class="pin table-v" style="left: 20.2%; top: 48.0%;"></div>
    <div id="pin-9" class="pin serp-s" style="left: 41.2%; top: 59.0%;"></div>

    <div id="pin-14" class="pin table-v" style="left: 11.4%; top: 71.5%;"></div>
    <div id="pin-15" class="pin table-v" style="left: 20.2%; top: 71.5%;"></div>
    <div id="pin-20" class="pin table-v" style="left: 29.2%; top: 71.5%;"></div>

    <!-- LADO DIREITO DA PISTA -->
    <div id="pin-4" class="pin table-v" style="left: 60.1%; top: 26.5%;"></div>
    <div id="pin-5" class="pin table-v" style="left: 68.1%; top: 26.5%;"></div>
    <div id="pin-serp-b" class="pin serp-v" style="left: 77.8%; top: 40.0%;"></div>
    <div id="pin-6" class="pin table-v" style="left: 86.2%; top: 26.5%;"></div>

    <div id="pin-10" class="pin serp-s" style="left: 62.4%; top: 59.0%;"></div>
    <div id="pin-11" class="pin table-v" style="left: 71.8%; top: 48.0%;"></div>
    <div id="pin-2" class="pin table-v" style="left: 86.6%; top: 48.0%;"></div>

    <div id="pin-16" class="pin table-v" style="left: 75.8%; top: 71.5%;"></div>
    <div id="pin-17" class="pin table-v" style="left: 86.0%; top: 71.5%;"></div>

    <!-- ÁREAS ESPECIAIS -->
    <div id="pin-dj" class="pin dj" style="left: 65.0%; top: 84.8%;"></div>
  </div>

  <script>
    const searchInput = document.getElementById('searchInput');
    const statusMessage = document.getElementById('statusMessage');
    const pins = document.querySelectorAll('.pin');

    // Mapeamento de buscas
    const mapKey = {
      "1": "pin-1", "01": "pin-1",
      "2": "pin-2", "02": "pin-2",
      "3": "pin-3", "03": "pin-3",
      "4": "pin-4", "04": "pin-4",
      "5": "pin-5", "05": "pin-5",
      "6": "pin-6", "06": "pin-6",
      "7": "pin-7", "07": "pin-7",
      "8": "pin-8", "08": "pin-8",
      "9": "pin-9", "09": "pin-9",
      "10": "pin-10",
      "11": "pin-11",
      "12": "pin-12",
      "14": "pin-14",
      "15": "pin-15",
      "16": "pin-16",
      "17": "pin-17",
      "20": "pin-20",
      "a": "pin-a", "mesa a": "pin-a", "hora a": "pin-a",
      "serp a": "pin-serp-a", "serpa": "pin-serp-a", "serp. a": "pin-serp-a",
      "serp b": "pin-serp-b", "serpb": "pin-serp-b", "serp. b": "pin-serp-b",
      "dj": "pin-dj"
    };

    searchInput.addEventListener('input', function() {
      const query = searchInput.value.trim().toLowerCase();

      // Limpa seleções anteriores
      pins.forEach(pin => pin.classList.remove('active'));
      statusMessage.textContent = '';

      if (query === '') return;

      let targetId = mapKey[query];

      if (!targetId) {
        // Tenta encontrar número puro
        const match = query.match(/\d+/);
        if (match) {
          const num = parseInt(match[0], 10);
          const formatted = num < 10 ? `0${num}` : `${num}`;
          targetId = mapKey[num.toString()] || mapKey[formatted];
        }
      }

      if (targetId) {
        const targetPin = document.getElementById(targetId);
        if (targetPin) {
          targetPin.classList.add('active');
        } else {
          statusMessage.textContent = 'Mesa mapeada não encontrada no layout.';
        }
      } else {
        statusMessage.textContent = 'Mesa não encontrada. Digite um número de 1 a 20, "A", "Serp A" ou "Serp B".';
      }
    });
  </script>

</body>
</html>
